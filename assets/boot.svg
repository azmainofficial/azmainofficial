<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-window {
      fill: url(#bg-grad);
      stroke: #30363d;
      stroke-width: 1.5;
      rx: 10px;
    }
    .header-bar {
      fill: #1c2128;
      stroke: #30363d;
      stroke-width: 1;
    }
    .header-title {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      font-size: 12px;
      fill: #8b949e;
      text-anchor: middle;
      font-weight: 600;
    }
    .text-base {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      font-size: 13.5px;
      letter-spacing: 0.2px;
    }
    .ts { fill: #6e7681; }
    .ok { fill: #3fb950; font-weight: 600; }
    .cyan { fill: #58a6ff; }
    .yellow { fill: #d29922; }
    .box-border { fill: #388bfd; }
    .label { fill: #f0f6fc; font-weight: 700; }
    .val-pink { fill: #ff7b72; font-weight: 600; }
    .val-green { fill: #7ee787; }
    .val-cyan { fill: #79c0ff; }
    .val-orange { fill: #ffa657; }
    .val-magenta { fill: #d2a8ff; }
    .prompt-user { fill: #7ee787; font-weight: 700; }
    .prompt-dir { fill: #79c0ff; font-weight: 700; }
    .cursor {
      fill: #58a6ff;
      animation: blink 1s step-start infinite;
    }

    .line {
      opacity: 0;
      animation: fadeIn 0.12s ease-out forwards;
    }
    .l1  { animation-delay: 0.1s; }
    .l2  { animation-delay: 0.35s; }
    .l3  { animation-delay: 0.6s; }
    .l4  { animation-delay: 0.85s; }
    .l5  { animation-delay: 1.1s; }
    .l6  { animation-delay: 1.35s; }
    .l7  { animation-delay: 1.6s; }
    .l8  { animation-delay: 1.85s; }
    .l9  { animation-delay: 2.1s; }
    .l10 { animation-delay: 2.35s; }
    .l11 { animation-delay: 2.6s; }
    .l12 { animation-delay: 2.85s; }
    .l13 { animation-delay: 3.1s; }
    .l14 { animation-delay: 3.35s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="836" height="476" class="terminal-window" />

  <!-- Header Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 828 2 Q 838 2 838 12 L 838 34 L 2 34 Z" class="header-bar" />
  
  <!-- Window Controls -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
  
  <!-- Header Title -->
  <text x="420" y="22" class="header-title">azmain@robotics-node: ~ (ROS 2 Humble / CAN Bus @ 1Mbps)</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 60)" class="text-base">
    <g class="line l1">
      <text y="0"><tspan class="ts">[  0.000000] </tspan><tspan class="ok">AZMAIN-ROBOTICS RTOS v2.0.0</tspan> (x86_64 Embedded Real Mode)</text>
    </g>
    <g class="line l2">
      <text y="22"><tspan class="ts">[  0.012400] </tspan><tspan class="cyan">Initializing CAN Bus, I2C &amp; SPI peripheral buses ... </tspan><tspan class="ok">OK</tspan></text>
    </g>
    <g class="line l3">
      <text y="44"><tspan class="ts">[  0.048000] </tspan><tspan class="cyan">Calibrating IMU, Kinematics &amp; Motor Encoders ........ </tspan><tspan class="ok">OK</tspan></text>
    </g>
    <g class="line l4">
      <text y="66"><tspan class="ts">[  0.095000] </tspan><tspan class="yellow">Starting ROS 2 Daemon &amp; Neural Vision Pipeline ...... </tspan><tspan class="ok">OK</tspan></text>
    </g>

    <!-- Robotics Profile Box -->
    <g class="line l5">
      <text y="94" class="box-border">+-------------------------------------------------------------------------+</text>
    </g>
    <g class="line l6">
      <text y="116"><tspan class="box-border">| </tspan><tspan class="label">IDENTIFIER : </tspan><tspan class="val-pink">Azmain Sheikh (@azmainofficial)</tspan><tspan class="box-border" dx="188">|</tspan></text>
    </g>
    <g class="line l7">
      <text y="138"><tspan class="box-border">| </tspan><tspan class="label">DISCIPLINE : </tspan><tspan class="val-green">Robotics Engineer &amp; Deep Learning Researcher</tspan><tspan class="box-border" dx="76">|</tspan></text>
    </g>
    <g class="line l8">
      <text y="160"><tspan class="box-border">| </tspan><tspan class="label">ROBOTICS   : </tspan><tspan class="val-cyan">ROS, ROS 2, Micro-ROS, Kinematics, SLAM, Actuators</tspan><tspan class="box-border" dx="36">|</tspan></text>
    </g>
    <g class="line l9">
      <text y="182"><tspan class="box-border">| </tspan><tspan class="label">HARDWARE   : </tspan><tspan class="val-orange">CAD Modeling, 3D Printing, Rapid Prototyping, IoT</tspan><tspan class="box-border" dx="34">|</tspan></text>
    </g>
    <g class="line l10">
      <text y="204"><tspan class="box-border">| </tspan><tspan class="label">AI &amp; VISION: </tspan><tspan class="val-magenta">Computer Vision, Neural Networks, PyTorch, OpenCV</tspan><tspan class="box-border" dx="42">|</tspan></text>
    </g>
    <g class="line l11">
      <text y="226"><tspan class="box-border">| </tspan><tspan class="label">EMBEDDED   : </tspan><tspan class="val-pink">C/C++, STM32, ESP32, FreeRTOS, Linux Kernel, CAN</tspan><tspan class="box-border" dx="52">|</tspan></text>
    </g>
    <g class="line l12">
      <text y="248" class="box-border">+-------------------------------------------------------------------------+</text>
    </g>

    <!-- Shell prompt -->
    <g class="line l13">
      <text y="280"><tspan class="ts">[  0.220000] </tspan><tspan class="ok">Robotics Subsystems Online.</tspan> Dropping to interactive shell...</text>
    </g>
    <g class="line l14">
      <text y="315"><tspan class="prompt-user">azmain@robotics-node</tspan>:<tspan class="prompt-dir">~</tspan>$ ros2 node list &amp;&amp; ./inspect_actuators.sh</text>
      <text y="337" fill="#8b949e">&gt;&gt; /vision/camera_stream  [30 FPS Active] | /control/inverse_kinematics  [Converged]</text>
      <text y="359" fill="#8b949e">&gt;&gt; /sensors/imu_fusion   [Calibrated 0.001 deg] | /hardware/can_bus_0  [Operational]</text>
      <text y="390"><tspan class="prompt-user">azmain@robotics-node</tspan>:<tspan class="prompt-dir">~</tspan>$ <tspan class="cursor">█</tspan></text>
    </g>
  </g>
</svg>
