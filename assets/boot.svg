<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-window {
      fill: url(#bg-grad);
      stroke: #30363d;
      stroke-width: 1.5;
      rx: 10px;
    }
    .header-bar {
      fill: #1c2128;
      stroke: #30363d;
      stroke-width: 1;
    }
    .header-title {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      font-size: 12px;
      fill: #8b949e;
      text-anchor: middle;
      font-weight: 600;
    }
    .text-base {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      font-size: 13.5px;
      letter-spacing: 0.2px;
    }
    .ts { fill: #6e7681; }
    .ok { fill: #3fb950; font-weight: 600; }
    .cyan { fill: #58a6ff; }
    .yellow { fill: #d29922; }
    .box-border { fill: #388bfd; }
    .label { fill: #f0f6fc; font-weight: 700; }
    .val-pink { fill: #ff7b72; font-weight: 600; }
    .val-green { fill: #7ee787; }
    .val-cyan { fill: #79c0ff; }
    .val-orange { fill: #ffa657; }
    .val-magenta { fill: #d2a8ff; }
    .prompt-user { fill: #7ee787; font-weight: 700; }
    .prompt-dir { fill: #79c0ff; font-weight: 700; }
    .cursor {
      fill: #58a6ff;
      animation: blink 1s step-start infinite;
    }

    /* Staggered appearance animations */
    .line {
      opacity: 0;
      animation: fadeIn 0.15s ease-out forwards;
    }
    .l1  { animation-delay: 0.1s; }
    .l2  { animation-delay: 0.4s; }
    .l3  { animation-delay: 0.7s; }
    .l4  { animation-delay: 1.0s; }
    .l5  { animation-delay: 1.3s; }
    .l6  { animation-delay: 1.6s; }
    .l7  { animation-delay: 1.9s; }
    .l8  { animation-delay: 2.2s; }
    .l9  { animation-delay: 2.5s; }
    .l10 { animation-delay: 2.8s; }
    .l11 { animation-delay: 3.1s; }
    .l12 { animation-delay: 3.4s; }
    .l13 { animation-delay: 3.7s; }
    .l14 { animation-delay: 4.0s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="836" height="466" class="terminal-window" />

  <!-- Header Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 828 2 Q 838 2 838 12 L 838 34 L 2 34 Z" class="header-bar" />
  
  <!-- Window Controls -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
  
  <!-- Header Title -->
  <text x="420" y="22" class="header-title">azmain@x86-qemu: ~ (COM1 115200 8N1 serial)</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 60)" class="text-base">
    <!-- Boot Sequence Messages -->
    <g class="line l1">
      <text y="0"><tspan class="ts">[  0.000000] </tspan><tspan class="ok">AZMAIN-OS Bootloader v1.0.4</tspan> (x86_64 Real Mode MBR)</text>
    </g>
    <g class="line l2">
      <text y="22"><tspan class="ts">[  0.012400] </tspan><tspan class="cyan">Initializing COM1 115200 8N1 serial console ... </tspan><tspan class="ok">OK</tspan></text>
    </g>
    <g class="line l3">
      <text y="44"><tspan class="ts">[  0.048000] </tspan><tspan class="cyan">Testing memory (640K Base / 64M Extended) ..... </tspan><tspan class="ok">OK</tspan></text>
    </g>
    <g class="line l4">
      <text y="66"><tspan class="ts">[  0.095000] </tspan><tspan class="yellow">Loading target payload: developer.profile ...</tspan></text>
    </g>

    <!-- Profile Box -->
    <g class="line l5">
      <text y="94" class="box-border">+-------------------------------------------------------------------------+</text>
    </g>
    <g class="line l6">
      <text y="116"><tspan class="box-border">| </tspan><tspan class="label">IDENTIFIER : </tspan><tspan class="val-pink">Azmain Sheikh (@azmainofficial)</tspan><tspan class="box-border" dx="188">|</tspan></text>
    </g>
    <g class="line l7">
      <text y="138"><tspan class="box-border">| </tspan><tspan class="label">LOCATION   : </tspan><tspan class="val-green">Dhaka, Bangladesh [UTC+6]</tspan><tspan class="box-border" dx="242">|</tspan></text>
    </g>
    <g class="line l8">
      <text y="160"><tspan class="box-border">| </tspan><tspan class="label">ROLE       : </tspan><tspan class="val-cyan">Full-Stack &amp; ML Dev | Blending Software &amp; AI</tspan><tspan class="box-border" dx="90">|</tspan></text>
    </g>
    <g class="line l9">
      <text y="182"><tspan class="box-border">| </tspan><tspan class="label">STACK      : </tspan><tspan class="val-orange">C, C++, Qt, Python, TensorFlow, React Native, Laravel</tspan><tspan class="box-border" dx="20">|</tspan></text>
    </g>
    <g class="line l10">
      <text y="204"><tspan class="box-border">| </tspan><tspan class="label">TAGLINE    : </tspan><tspan class="val-magenta">"Powered by Code, Tea, and Kacchi"</tspan><tspan class="box-border" dx="178">|</tspan></text>
    </g>
    <g class="line l11">
      <text y="226"><tspan class="box-border">| </tspan><tspan class="label">DIAGNOSTIC : </tspan><tspan class="val-pink">"I debug faster than I eat biryani."</tspan><tspan class="box-border" dx="162">|</tspan></text>
    </g>
    <g class="line l12">
      <text y="248" class="box-border">+-------------------------------------------------------------------------+</text>
    </g>

    <!-- Shell prompt -->
    <g class="line l13">
      <text y="280"><tspan class="ts">[  0.210000] </tspan><tspan class="ok">Kernel ready.</tspan> Dropping to interactive userland shell...</text>
    </g>
    <g class="line l14">
      <text y="315"><tspan class="prompt-user">azmain@bare-metal</tspan>:<tspan class="prompt-dir">~</tspan>$ cat /proc/status | grep "CURRENT_FOCUS" &amp;&amp; ./launch_portfolio.sh</text>
      <text y="337" fill="#8b949e">&gt;&gt; High-performance systems, Machine Learning pipelines &amp; modern full-stack apps.</text>
      <text y="370"><tspan class="prompt-user">azmain@bare-metal</tspan>:<tspan class="prompt-dir">~</tspan>$ <tspan class="cursor">█</tspan></text>
    </g>
  </g>
</svg>

